name: Option 39 pacing checks

on:
  pull_request:
    paths:
      - net-tcp-tune.sh
      - tests/**
      - .github/workflows/pacing-tests.yml
  push:
    branches: [main, fix/option39-pacing-recovery]
    paths:
      - net-tcp-tune.sh
      - tests/**
      - .github/workflows/pacing-tests.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pacing:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y iproute2 jq util-linux
      - name: Check Bash syntax
        run: |
          bash -n net-tcp-tune.sh
          bash -n tests/pacing-netns.sh
      - name: Run isolated control-flow tests
        run: python3 -B -m unittest discover -s tests -v
      - name: Verify real FQ in an isolated network namespace
        run: sudo bash tests/pacing-netns.sh
