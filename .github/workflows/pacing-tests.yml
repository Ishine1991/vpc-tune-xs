name: Option 39 pacing checks

on:
  pull_request:
    paths:
      - '**/*.sh'
      - tests/**
      - .gitattributes
      - .github/workflows/pacing-tests.yml
  push:
    branches: [main, fix/option39-pacing-recovery, fix/option39-zero-handle]
    paths:
      - '**/*.sh'
      - tests/**
      - .gitattributes
      - .github/workflows/pacing-tests.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pacing:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y iproute2 jq util-linux
      - name: Check Bash syntax
        run: |
          find . -type f -name '*.sh' -not -path './.git/*' -print0 | xargs -0 -n1 bash -n
      - name: Reject CRLF in shell scripts
        run: |
          python3 - <<'PY'
          from pathlib import Path

          bad = [
              str(path)
              for path in Path('.').rglob('*.sh')
              if '.git' not in path.parts and b'\r' in path.read_bytes()
          ]
          if bad:
              raise SystemExit('Shell scripts contain CR bytes: ' + ', '.join(bad))
          PY
      - name: Run isolated control-flow tests
        run: python3 -B -m unittest discover -s tests -v
      - name: Verify real FQ in an isolated network namespace
        run: |
          old=$(sysctl -n net.core.default_qdisc)
          trap 'sudo sysctl -w net.core.default_qdisc="$old"' EXIT
          sudo sysctl -w net.core.default_qdisc=fq
          sudo env PACING_TEST_DEFAULT_FQ=1 bash tests/pacing-netns.sh
